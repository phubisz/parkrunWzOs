<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;700&family=Anton&family=IBM+Plex+Sans:wght@400;500;600;700&family=Sora:wght@600;700&family=Manrope:wght@400;500;700&family=Instrument+Serif:ital@0;1&family=Karla:wght@400;500;700&display=swap" rel="stylesheet" crossorigin="anonymous">
<!-- html-to-image rasterises via SVG foreignObject, so text is laid out by the browser
     itself. html2canvas re-implements text layout and gets tight line-heights wrong
     (the hero number uses line-height 0.84), which made exports differ from the preview. -->

    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

<body class="bg-gray-100 min-h-screen">
  <div class="max-w-5xl mx-auto py-8 px-4">
    <div class="flex items-center justify-between mb-6">
      <h1 class="text-2xl font-bold text-gray-900">Plakat tygodnia</h1>

        <span id="data-info" class="text-gray-600"></span>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

      <div class="flex flex-wrap gap-3 items-center">

        <label class="flex items-center gap-2 text-sm text-gray-600">
          <span class="font-semibold text-gray-700">Jakość PNG</span>
          <select id="input-export-scale" class="border border-gray-300 rounded-lg px-2 py-2 bg-white">
            <option value="2">2× · 2480 px</option>
            <option value="3" selected>3× · 3720 px</option>
            <option value="4">4× · 4960 px</option>
          </select>
        </label>
        <button id="btn-pdf" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg font-semibold text-sm hover:bg-gray-300 transition">Pobierz PDF (drukuj)</button>

  </div>

  <div id="poster-wrap" class="overflow-auto bg-gray-200 p-4 flex justify-center print:p-0 print:bg-white">
    <div id="poster-scale-wrap" style="transform-origin: top center;">
      <div id="poster-root"></div>
    </div>
  </div>

<script>
// ---------- Refresh (n8n) ----------
// n8n webhook that re-fetches the latest results from parkrun.pl, commits
// poster-data.json and replies with the new data. The token lives in the URL
// (?token=...), never in this file, so people get a personal link rather than a
// secret baked into the page source. n8n also hands back its last build for 10
// minutes instead of hitting parkrun.pl on every press.
const REFRESH_WEBHOOK_URL = 'https://n8n.domowehuby.uk/webhook/648cefee-cb15-4ffc-a8d3-9371575d43e7';
const REFRESH_TOKEN = new URLSearchParams(location.search).get('token');

// ---------- State ----------
const state = {
  data: null,
  style: localStorage.getItem('posterStyle') || 'modernist',
  photoUrl: null,
  // Natural pixel size of the loaded photo, needed to compute the "cover" fit.
  photoNat: null,
  // Zoom multiplier over the cover fit. 1 = exactly covers the frame.
  photoZoom: 1,
  // Free transform of the photo within its frame: pan in px from centre,
  // rotation in degrees, zoom relative to the cover fit.
  photoPan: { x: 0, y: 0 },
  photoRot: 0,
  // CSS filter applied to the photo only (the overlays are siblings, so text stays clean).
  photoFilter: { brightness: 100, contrast: 100, saturate: 100, sepia: 0, grayscale: 0, hue: 0 },
  photoPreset: 'Brak',
};

const FILTER_PRESETS = {
  'Brak':          { brightness: 100, contrast: 100, saturate: 100, sepia: 0,  grayscale: 0,   hue: 0 },
  'Jasny':         { brightness: 115, contrast: 104, saturate: 105, sepia: 0,  grayscale: 0,   hue: 0 },
  'Żywy':          { brightness: 104, contrast: 116, saturate: 140, sepia: 0,  grayscale: 0,   hue: 0 },
  'Ciepły':        { brightness: 106, contrast: 104, saturate: 112, sepia: 28, grayscale: 0,   hue: -6 },
  'Chłodny':       { brightness: 102, contrast: 110, saturate: 92,  sepia: 0,  grayscale: 0,   hue: 12 },
  'Czarno-biały':  { brightness: 104, contrast: 112, saturate: 100, sepia: 0,  grayscale: 100, hue: 0 },
};

function filterCss(f) {
  return `brightness(${f.brightness}%) contrast(${f.contrast}%) saturate(${f.saturate}%)`
    + ` sepia(${f.sepia}%) grayscale(${f.grayscale}%) hue-rotate(${f.hue}deg)`;
}

const STYLES = [
  { key: 'modernist', label: 'Modernist' },
  { key: 'night', label: 'Night' },
  { key: 'bib', label: 'Bib' },
  { key: 'data', label: 'Data' },
  { key: 'trail', label: 'Trail' },
];

// ---------- Helpers ----------
function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtDate(iso) {
  if (!iso) return '';
  const parts = iso.split('-');
  if (parts.length !== 3) return iso;
  const [y, m, d] = parts;
  return `${d}.${m}.${y}`;
}
function pct(n, total) {
  if (!total) return 0;
  return (n / total) * 100;
}
function nameOrDash(n) { return n ? esc(n) : '—'; }
function joinNames(list) { return (list && list.length) ? list.map(esc).join(', ') : '—'; }

function photoDiv(shapeStyle, placeholderText) {
  if (state.photoUrl) {
    // A real <img> rather than a background, because backgrounds can't be rotated.
    // Sizing/placement is done entirely in applyPhotoTransform().
    return `<div data-photo-frame tabindex="0" role="img" aria-label="Zdjęcie. Przeciągnij, aby zmienić kadr." style="${shapeStyle} overflow:hidden; filter:${filterCss(state.photoFilter)}; cursor:grab; touch-action:none; user-select:none;">`
      + `<img data-photo-img src="${state.photoUrl}" alt="" draggable="false" style="position:absolute; left:50%; top:50%; max-width:none; pointer-events:none;">`
      + `</div>`;
  }
  return `<div style="${shapeStyle} display:flex; align-items:center; justify-content:center; font-size:13px; text-align:center; padding:20px; box-sizing:border-box;">${esc(placeholderText)}</div>`;
}

// Base geometry: the size the photo would be at zoom 1 to just cover this frame.
function photoLayout(el) {
  const fw = el.clientWidth, fh = el.clientHeight;
  const nat = state.photoNat;
  if (!nat || !fw || !fh) return null;
  const cover = Math.max(fw / nat.w, fh / nat.h);
  return { fw, fh, baseW: nat.w * cover, baseH: nat.h * cover };
}

// How much zoom would be needed for the photo to still cover the frame, given a
// rotation and an offset. Checks the worst-case frame corner in the photo's own
// rotated space, so it is exact rather than a conservative bound.
function zoomNeeded(L, tx, ty) {
  const r = state.photoRot * Math.PI / 180;
  const c = Math.cos(r), s = Math.sin(r);
  const ac = Math.abs(c), as = Math.abs(s);
  // Project both the frame and its offset into the photo's rotated axes.
  const offsetU = Math.abs(c * tx + s * ty);
  const offsetV = Math.abs(s * tx - c * ty);
  return Math.max(
    (ac * L.fw + as * L.fh + 2 * offsetU) / L.baseW,
    (as * L.fw + ac * L.fh + 2 * offsetV) / L.baseH
  );
}

function updateCoverageWarning(L, zoom) {
  const warn = document.getElementById('coverage-warning');
  if (!warn) return;
  const covered = !L || zoom >= zoomNeeded(L, state.photoPan.x, state.photoPan.y) - 1e-3;
  warn.classList.toggle('hidden', covered);
}

// Zoom just enough to fill the frame at the current position and rotation.
function fillFrame() {
  const el = document.querySelector('#poster-root [data-photo-frame]');
  const L = el ? photoLayout(el) : null;
  if (!L) return;
  setZoom(zoomNeeded(L, state.photoPan.x, state.photoPan.y));
}

function applyPhotoTransform(el) {
  el = el || document.querySelector('#poster-root [data-photo-frame]');
  if (!el) return;
  const img = el.querySelector('[data-photo-img]');
  const L = photoLayout(el);
  if (!img || !L) return;

  // Scaling is deliberately unconstrained: users may shrink the photo below its
  // cover fit. Any exposed frame is reported by the existing warning and can be
  // corrected with "Wypełnij kadr".
  const eff = state.photoZoom;
  syncZoomUi(eff);
  updateCoverageWarning(L, eff);

  img.style.width = `${L.baseW}px`;
  img.style.height = `${L.baseH}px`;
  img.style.marginLeft = `${-L.baseW / 2}px`;
  img.style.marginTop = `${-L.baseH / 2}px`;
  // Leftmost transform is outermost, so the translate happens in the frame's own
  // axes — dragging stays 1:1 with the cursor no matter how the photo is rotated.
  img.style.transform = `translate(${state.photoPan.x}px, ${state.photoPan.y}px)`
    + ` rotate(${state.photoRot}deg) scale(${eff})`;
  el.style.filter = filterCss(state.photoFilter);
}

function setFilter(patch, opts) {
  Object.assign(state.photoFilter, patch);
  const f = state.photoFilter;
  if (!opts || !opts.fromSlider) {
    ['brightness', 'contrast', 'saturate'].forEach(k => {
      const s = document.getElementById(`input-${k}`);
      if (s) s.value = String(f[k]);
    });
  }
  applyPhotoTransform();
}

function syncZoomUi(z) {
  const slider = document.getElementById('input-zoom');
  const label = document.getElementById('zoom-value');
  if (slider) slider.value = String(Math.round(z * 100));
  if (label) label.textContent = `${Math.round(z * 100)}%`;
}

function setZoom(z, anchor, oldVisualZoom) {
  const el = document.querySelector('#poster-root [data-photo-frame]');
  const oldZoom = oldVisualZoom || state.photoZoom;
  state.photoZoom = Math.min(6, Math.max(0.1, z));
  if (anchor && oldZoom > 0) {
    const ratio = state.photoZoom / oldZoom;
    state.photoPan.x = anchor.x + (state.photoPan.x - anchor.x) * ratio;
    state.photoPan.y = anchor.y + (state.photoPan.y - anchor.y) * ratio;
  }
  applyPhotoTransform(el);
}

function setRotation(deg) {
  state.photoRot = Math.max(-180, Math.min(180, deg));
  const slider = document.getElementById('input-rotate');
  const label = document.getElementById('rotate-value');
  if (slider) slider.value = String(Math.round(state.photoRot));
  if (label) label.textContent = `${Math.round(state.photoRot)}°`;
  applyPhotoTransform();
}

function resetPhotoFraming() {
  state.photoPan = { x: 0, y: 0 };
  setRotation(0);
  setZoom(1);
}

// Drag to reposition, wheel to zoom.
function attachPhotoDrag() {
  const el = document.querySelector('#poster-root [data-photo-frame]');
  if (!el) return;
  applyPhotoTransform(el);

  let dragging = false, startX = 0, startY = 0, startPan = null;

  el.addEventListener('pointerdown', e => {
    dragging = true;
    startX = e.clientX;
    startY = e.clientY;
    startPan = { ...state.photoPan };
    el.setPointerCapture(e.pointerId);
    el.style.cursor = 'grabbing';
    e.preventDefault();
  });

  el.addEventListener('pointermove', e => {
    if (!dragging) return;
    state.photoPan.x = startPan.x + (e.clientX - startX);
    state.photoPan.y = startPan.y + (e.clientY - startY);
    applyPhotoTransform(el);
  });

  const stop = () => {
    if (!dragging) return;
    dragging = false;
    el.style.cursor = 'grab';
  };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);

  el.addEventListener('keydown', e => {
    if (!['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].includes(e.key)) return;
    const step = e.shiftKey ? 10 : 1;
    if (e.key === 'ArrowLeft') state.photoPan.x -= step;
    if (e.key === 'ArrowRight') state.photoPan.x += step;
    if (e.key === 'ArrowUp') state.photoPan.y -= step;
    if (e.key === 'ArrowDown') state.photoPan.y += step;
    applyPhotoTransform(el);
    e.preventDefault();
  });

  el.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = el.getBoundingClientRect();
    const visualZoom = state.photoZoom;
    setZoom(visualZoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08), {
      x: e.clientX - rect.left - rect.width / 2,
      y: e.clientY - rect.top - rect.height / 2,
    }, visualZoom);
  }, { passive: false });
}

function fastestRow(entry) {
  if (!entry) return { name: '—', time: '—:—', ageGroup: '—', grade: '—' };
  return {
    name: esc(entry.name),
    time: esc(entry.time || '—:—'),
    ageGroup: esc(entry.ageGroup || '—'),
    grade: entry.ageGrade != null ? entry.ageGrade.toFixed(2) + '%' : '—',
  };
}

// ---------- Style 1: Modernist ----------
function renderModernist(d) {
  const men = pct(d.men, d.finishers), women = pct(d.women, d.finishers), unk = pct(d.unknown, d.finishers);
  const f0 = fastestRow(d.fastest[0]), f1 = fastestRow(d.fastest[1]);
  const a0 = fastestRow(d.bestAgeGrade[0]), a1 = fastestRow(d.bestAgeGrade[1]);
  const mp = (d.mostParkruns || []).slice(0, 2);
  const mv = (d.mostVolunteerCredits || []).slice(0, 3);
  const milestoneRows = (d.milestones || []).map(m => `
    <div style="height: 2px; background: #605d5d;"></div>
    <div style="display: flex; align-items: baseline; gap: 18px;">
      <span style="font-family: Archivo, sans-serif; font-weight: 800; font-size: 56px; line-height: 0.9; color: #ff9783; font-variant-numeric: tabular-nums;">${m.count}</span>
      <div style="display: flex; flex-direction: column; gap: 2px;">
        <span style="font-size: 20px; font-weight: 700;">${esc(m.name)}</span>
        <span style="font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #a8a4a4;">${m.kind === 'parkrun' ? 'parkrun' : 'inne kamienie milowe'}</span>
      </div>
    </div>`).join('') || `<span style="font-size:15px; color:#a8a4a4;">Brak w tym tygodniu</span>`;

  return `
  <div style="width: 1240px; margin: 0 auto; background: #f3f2f2; color: #201e1d; font-family: Archivo, sans-serif; padding: 48px 56px 56px; box-sizing: border-box;">
    <header style="display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 24px; border-bottom: 4px solid #201e1d; padding-bottom: 30px;">
      <div style="display: flex; flex-direction: column; gap: 6px;">
        <div style="font-size: 15px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; color: #ae1800;">parkrun · podsumowanie tygodnia</div>
        <h1 style="margin: 0; font-weight: 800; font-size: 68px; line-height: 0.92; letter-spacing: -0.02em;">Wzniesienie<br>Osowy</h1>
      </div>
      <div style="display: flex; gap: 0; align-items: stretch; border-left: 2px solid #201e1d;">
        <div style="padding: 8px 24px 4px; border-right: 2px solid #201e1d; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #605d5d;">Edycja</span>
          <span style="font-weight: 800; font-size: 40px; line-height: 1; color: #ec3013;">#${d.edition}</span>
        </div>
        <div style="padding: 8px 0 4px 24px; display: flex; flex-direction: column; gap: 4px;">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; color: #605d5d;">Data</span>
          <span style="font-weight: 800; font-size: 40px; line-height: 1;">${fmtDate(d.date)}</span>
        </div>
      </div>
    </header>

    <section style="margin-top: 28px; display: flex; flex-direction: column;">
      <div style="position: relative; height: 470px;">
        ${photoDiv('position:absolute; inset:0; background:#e2e0e0; color:#605d5d;', 'Przeciągnij zdjęcie z tego tygodnia')}
        <div style="position: absolute; top: 0; left: 0; pointer-events: none; background: #ec3013; color: #f5f4f4; padding: 22px 34px 26px; display: flex; flex-direction: column; gap: 2px;">
          <span style="font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;">Uczestnicy</span>
          <span style="font-weight: 800; font-size: 132px; line-height: 0.84; letter-spacing: -0.04em;">${d.finishers}</span>
        </div>
        ${d.courseNote ? `<div style="position: absolute; top: 0; right: 0; pointer-events: none; background: #201e1d; color: #f5f4f4; padding: 14px 24px; font-size: 13px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;">${esc(d.courseNote)}</div>` : ''}
        ${d.caption ? `<div style="position: absolute; left: 0; right: 0; bottom: 0; pointer-events: none; background: #201e1d; color: #f5f4f4; padding: 14px 24px; display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: baseline;">
          <span style="font-size: 12px; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase; color: #ff9783;">Fot.</span>
          <p style="margin: 0; font-size: 15px; line-height: 1.4;">${esc(d.caption)}</p>
        </div>` : ''}
      </div>
    </section>

        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: #b0552a;">Najszybsi uczestnicy</span>
        <div style="display: grid; grid-template-columns: 1fr auto 92px 76px; gap: 10px 14px; align-items: baseline; font-size: 17px; border-top: 1px solid #c9c0a8; padding-top: 12px;">
          <span style="font-weight: 700;">${f0.name}</span><span style="font-family: 'Instrument Serif', serif; font-size: 24px;">${f0.time}</span><span style="font-size: 14px; color: #7c8877;">${f0.ageGroup}</span><span style="text-align: right;">${f0.grade}</span>
          <span style="font-weight: 700;">${f1.name}</span><span style="font-family: 'Instrument Serif', serif; font-size: 24px;">${f1.time}</span><span style="font-size: 14px; color: #7c8877;">${f1.ageGroup}</span><span style="text-align: right;">${f1.grade}</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: #b0552a;">Najwyższy współczynnik wieku</span>
        <div style="display: grid; grid-template-columns: 1fr auto 92px 76px; gap: 10px 14px; align-items: baseline; font-size: 17px; border-top: 1px solid #c9c0a8; padding-top: 12px;">
          <span style="font-weight: 700;">${a0.name}</span><span style="font-family: 'Instrument Serif', serif; font-size: 24px;">${a0.time}</span><span style="font-size: 14px; color: #7c8877;">${a0.ageGroup}</span><span style="text-align: right; color: #2f5d43; font-weight: 700;">${a0.grade}</span>

        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <span style="font-family: 'Instrument Serif', serif; font-style: italic; font-size: 22px; color: #b0552a;">Najwięcej parkrunów</span>
        <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: baseline; font-size: 17px; border-top: 1px solid #c9c0a8; padding-top: 12px;">
          ${mp.map(r => `<span style="font-weight: 700;">${nameOrDash(r.name)}</span><span style="font-family: 'Instrument Serif', serif; font-size: 26px;">${r.runs}</span>`).join('') || '—'}
        </div>

      <div style="display: flex; flex-direction: column; gap: 12px;">

        <div style="display: grid; grid-template-columns: 1fr auto; gap: 10px 14px; align-items: baseline; font-size: 17px; border-top: 1px solid #c9c0a8; padding-top: 12px;">
          ${mv.map(r => `<span style="font-weight: 700;">${nameOrDash(r.name)}</span><span style="font-family: 'Instrument Serif', serif; font-size: 26px;">${r.credits}</span>`).join('') || '—'}

    <section style="margin-top: 38px; display: grid; grid-template-columns: 1fr 1.6fr; gap: 48px; border-top: 1px solid #c9c0a8; padding-top: 24px;">

        <p style="margin: 0; font-size: 17px; line-height: 1.6;">${joinNames(d.newPBs)}</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <span style="font-size: 12px; letter-spacing: 0.24em; text-transform: uppercase; color: #7c8877;">Wolontariusze · ${d.volunteers}</span>
        <p style="margin: 0; font-size: 17px; line-height: 1.6;">${(d.volunteerList || []).map(esc).join(', ') || '—'}</p>

}

const RENDERERS = { modernist: renderModernist, night: renderNight, bib: renderBib, data: renderData, trail: renderTrail };

// ---------- App wiring ----------
function currentData() {
  const d = Object.assign({}, state.data);
  d.caption = document.getElementById('input-caption').value.trim();
  d.courseNote = document.getElementById('input-course').value.trim();
  d.personalBests = d.personalBests || 0;
  d.newPBs = d.newPBs || [];
  d.fastest = d.fastest || [];
  d.bestAgeGrade = d.bestAgeGrade || [];
  d.mostParkruns = d.mostParkruns || [];
  d.mostVolunteerCredits = d.mostVolunteerCredits || [];
  d.milestones = d.milestones || [];
  d.volunteerList = d.volunteerList || [];
  return d;
}

function render() {
  if (!state.data) return;
  const fn = RENDERERS[state.style] || renderModernist;
  document.getElementById('poster-root').innerHTML = fn(currentData());
  attachPhotoDrag();
}

// Built with a ternary rather than toggling classes on a fixed base, because
// Tailwind resolves conflicting utilities by stylesheet order, not class order —
// adding bg-gray-900/text-white on top of bg-white/text-gray-700 gave white-on-white.
function renderFilterPresets() {
  const wrap = document.getElementById('filter-presets');
  wrap.innerHTML = Object.keys(FILTER_PRESETS).map(name => {
    const on = name === state.photoPreset;
    return `<button class="filter-btn px-3 py-1 rounded-lg border text-sm ${
      on ? 'border-gray-900 bg-gray-900 text-white' : 'border-gray-300 bg-white text-gray-700 hover:bg-gray-50'
    }" data-preset="${name}">${name}</button>`;
  }).join('');

  wrap.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.photoPreset = btn.dataset.preset;
      renderFilterPresets();
      setFilter({ ...FILTER_PRESETS[btn.dataset.preset] });
    });
  });
}

function renderStyleButtons() {
  const wrap = document.getElementById('style-buttons');
  wrap.innerHTML = STYLES.map(s => `<button class="style-btn px-4 py-2 rounded-lg border border-gray-300 text-sm font-medium ${s.key === state.style ? 'active bg-gray-900 text-white' : 'bg-white text-gray-700'}" data-style="${s.key}">${s.label}</button>`).join('');
  wrap.querySelectorAll('.style-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.style = btn.dataset.style;
      localStorage.setItem('posterStyle', state.style);
      renderStyleButtons();
      render();
    });
  });
}

function setStatus(msg) {
  document.getElementById('status-text').textContent = msg;
  if (msg) setTimeout(() => { document.getElementById('status-text').textContent = ''; }, 3000);
}

// GitHub Pages sits behind a CDN that caches for ~10 minutes. cache: 'no-store'
// only covers the browser, so a query string is needed to get past the edge copy —
// otherwise even a successful refresh can look like nothing changed.
async function fetchPosterData() {
  const res = await fetch(`poster-data.json?t=${Date.now()}`, { cache: 'no-store' });
  if (!res.ok) throw new Error(`poster-data.json: HTTP ${res.status}`);
  return res.json();
}

function renderDataInfo() {
  const d = state.data;
  const info = document.getElementById('data-info');
  if (!d || !d.edition) { info.textContent = ''; return; }
  const when = d.generatedAt
    ? new Date(d.generatedAt).toLocaleString('pl-PL', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
    : null;
  info.textContent = `Dane: edycja #${d.edition}` + (when ? ` · pobrane ${when}` : '');
}

function setRefreshStatus(msg) {
  document.getElementById('refresh-status').textContent = msg;
}

async function requestRefresh() {
  const btn = document.getElementById('btn-refresh');
  btn.disabled = true;
  setRefreshStatus('Pobieranie wyników z parkrun.pl…');
  try {
    // Deliberately a CORS "simple request" (text/plain, no custom headers): n8n's
    // webhook CORS support doesn't answer preflight OPTIONS requests, and a JSON
    // body or an auth header would trigger one that the browser then blocks.
    const url = `${REFRESH_WEBHOOK_URL}?token=${encodeURIComponent(REFRESH_TOKEN)}`;
    const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain' }, body: 'refresh' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);

    // n8n replies with the freshly built data itself, so there's no waiting for the
    // commit to deploy through GitHub Pages. Only the data is swapped: caption,
    // photo, framing and style stay exactly as the user left them.
    const fresh = await res.json();
    if (!fresh || !fresh.edition) throw new Error(`unexpected reply: ${JSON.stringify(fresh)}`);
    state.data = fresh;
    renderDataInfo();
    render();
    setRefreshStatus('Dane zaktualizowane.');
  } catch (err) {
    console.error(err);
    setRefreshStatus('Nie udało się pobrać danych — spróbuj ponownie za kilka minut.');
  } finally {
    btn.disabled = false;
  }
}

async function loadData() {
  try {
    state.data = await fetchPosterData();
  } catch (e) {
    state.data = {
      event: 'parkrun Wzniesienie Osowy', edition: 0, date: new Date().toISOString().slice(0, 10),
      distanceKm: 5, finishers: 0, men: 0, women: 0, unknown: 0, volunteers: 0,
      personalBests: 0, firstTimers: 0, caption: '', milestones: [], fastest: [],
      bestAgeGrade: [], mostParkruns: [], mostVolunteerCredits: [], newPBs: [], volunteerList: [],
    };
    setStatus('Brak poster-data.json — uzupełnij dane ręcznie');
  }
  document.getElementById('input-caption').value = state.data.caption || '';
  document.getElementById('input-course').value = `${state.data.distanceKm || 5} km`;
  renderDataInfo();
}

function handleFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  if (state.photoUrl) URL.revokeObjectURL(state.photoUrl);
  state.photoUrl = URL.createObjectURL(file);
  state.photoNat = null;
  resetPhotoFraming();
  document.getElementById('drop-zone-text').textContent =
    `Wybrano: ${file.name} — przeciągnij zdjęcie na plakacie, przybliż suwakiem lub kółkiem myszy (kliknij tutaj, aby zmienić)`;

  // The natural size is needed to compute the cover fit that pan/zoom work from.
  const probe = new Image();
  probe.onload = () => {
    state.photoNat = { w: probe.naturalWidth, h: probe.naturalHeight };
    document.getElementById('drop-zone-text').textContent =
      `${file.name} · ${probe.naturalWidth} × ${probe.naturalHeight} px — przeciągnij zdjęcie bezpośrednio na plakacie`;
    render();
  };
  probe.src = state.photoUrl;

  render();
}

function initApp() {
  renderStyleButtons();
  ['input-caption', 'input-course'].forEach(id => {
    document.getElementById(id).addEventListener('input', render);
  });

  const dropZone = document.getElementById('drop-zone');
  const photoInput = document.getElementById('photo-input');
  dropZone.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', e => handleFile(e.target.files[0]));
  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('dragover'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFile(e.dataTransfer.files[0]);
  });

  document.getElementById('input-zoom').addEventListener('input', e => {
    setZoom(parseInt(e.target.value, 10) / 100);
  });
  document.getElementById('btn-zoom-reset').addEventListener('click', resetPhotoFraming);
  document.getElementById('input-rotate').addEventListener('input', e => {
    setRotation(parseInt(e.target.value, 10));
  });
  document.getElementById('btn-rot-left').addEventListener('click', () => setRotation(state.photoRot - 90));
  document.getElementById('btn-rot-right').addEventListener('click', () => setRotation(state.photoRot + 90));
  document.getElementById('btn-fill').addEventListener('click', fillFrame);

  renderFilterPresets();

  // Stays hidden until the webhook is configured and this page was opened with an
  // access token (?token=...) in its URL — regular visitors never see it, rather
  // than showing a button that can only ever fail.
  if (!REFRESH_WEBHOOK_URL.includes('YOUR-N8N') && REFRESH_TOKEN) {
    const btn = document.getElementById('btn-refresh');
    btn.classList.remove('hidden');
    btn.addEventListener('click', requestRefresh);
  }

  ['brightness', 'contrast', 'saturate'].forEach(key => {
    document.getElementById(`input-${key}`).addEventListener('input', e => {
      setFilter({ [key]: parseInt(e.target.value, 10) }, { fromSlider: true });
    });
  });

  document.getElementById('btn-png').addEventListener('click', async () => {
    setStatus('Generowanie PNG...');
    const target = document.getElementById('poster-root').firstElementChild;

    try {
      // Rasterised through SVG foreignObject, so the browser lays the text out
      // itself — the export is pixel-identical to the preview, with no
      // scroll-position or line-height workarounds needed.
      // NB: no cacheBust — it appends a query string to image URLs, which makes the
      // photo's blob: URL invalid and silently drops it from the export.
      const dataUrl = await htmlToImage.toPng(target, {
        pixelRatio: parseInt(document.getElementById('input-export-scale').value, 10),
        width: target.offsetWidth,
        height: target.offsetHeight,
      });
      const link = document.createElement('a');
      link.download = `parkrun_${state.data.edition || 'plakat'}_${state.style}.png`;
      link.href = dataUrl;
      link.click();
      setStatus('Pobrano PNG');
    } catch (err) {
      console.error(err);
      setStatus('Błąd generowania PNG');
    }
  });

  document.getElementById('btn-pdf').addEventListener('click', () => {
    window.print();
  });

  loadData().then(render);
}

window.onload = initApp;
</script>
