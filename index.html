<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wzniesienie Osowy parkrun - dyplomy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- Fonts for the original (PNG template) design only. -->
    <script src="fonts/Zeyada-Regular.js"></script>
    <script src="fonts/CaveatBrush-Regular.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js"></script>
    <!-- The diploma itself (layout, colours, milestone list) lives in diploma.js. -->
    <script src="diploma.js"></script>
    <style>
        /* Custom scrollbar for aesthetics */
        .custom-scrollbar::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background-color: #9ca3af;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen p-4 sm:p-8">

    <div id="app" class="max-w-4xl mx-auto bg-white shadow-2xl rounded-xl p-6 sm:p-10 border border-gray-100">
        
        <div class="flex justify-end mb-2">
            <a href="poster.html" class="text-sm text-blue-600 hover:underline">Plakat tygodnia &rarr;</a>
        </div>
        <h1 class="text-3xl font-extrabold text-blue-800 mb-6 text-center">
            parkrun Wzniesienie Osowy generator dyplomów
        </h1>
        <p class="text-gray-600 mb-3 text-center">
            <b>Liczba wizyt</b> to nieprzerwana liczba wizyt na naszym parkrunie przez daną osobę w ostatnich 10 edycjach.
        </p>
        <p id="data-info" class="text-sm text-gray-500 mb-6 text-center"></p>

        <div class="mb-8 flex flex-wrap items-center justify-center gap-3">
            <span class="text-sm font-medium text-gray-700">Wzór dyplomu</span>
            <div class="flex rounded-md overflow-hidden border border-gray-300">
                <button id="design-new" onclick="setDesign('new')" class="px-4 py-2 text-sm font-medium transition">Nowy</button>
                <button id="design-original" onclick="setDesign('original')" class="px-4 py-2 text-sm font-medium transition border-l border-gray-300">Oryginalny</button>
            </div>
            <a href="diploma-preview.html" class="text-sm text-blue-600 hover:underline">podgląd wszystkich</a>
            <p id="design-note" class="w-full text-xs text-gray-500 text-center"></p>
        </div>

        <div id="report-table-container" class="overflow-x-auto custom-scrollbar">
            </div>

        <!-- Manual diploma generator -->
        <div class="mt-10 pt-8 border-t border-gray-200">
            <h2 class="text-xl font-bold text-blue-800 mb-4">Wygeneruj dyplom ręcznie</h2>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Imię i nazwisko</label>
                    <input id="manual-name" type="text" placeholder="np. Jan Kowalski"
                        class="w-full rounded-md border border-gray-300 shadow-sm p-2 text-sm focus:border-blue-500 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Typ</label>
                    <div class="flex rounded-md overflow-hidden border border-gray-300 shadow-sm">
                        <button id="type-runner" onclick="setType('runner')"
                            class="flex-1 py-2 text-sm font-medium bg-blue-600 text-white transition">
                            🏃 Biegacz
                        </button>
                        <button id="type-vol" onclick="setType('vol')"
                            class="flex-1 py-2 text-sm font-medium bg-white text-gray-700 transition hover:bg-gray-50">
                            🙋 Wolontariusz
                        </button>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Milestone</label>
                    <select id="manual-milestone"
                        class="w-full rounded-md border border-gray-300 shadow-sm p-2 text-sm focus:border-blue-500 focus:ring-blue-500">
                        <!-- Filled from DIPLOMA_MILESTONES in initApp(). -->
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Data</label>
                    <input id="manual-date" type="date"
                        class="w-full rounded-md border border-gray-300 shadow-sm p-2 text-sm focus:border-blue-500 focus:ring-blue-500">
                </div>
            </div>
            <button onclick="generateManualDiploma()"
                class="mt-5 px-6 py-2 text-sm font-medium text-white bg-blue-600 rounded-full hover:bg-blue-700 transition shadow-md">
                Pobierz dyplom
            </button>
        </div>

        <div id="notification" class="fixed inset-0 bg-gray-600 bg-opacity-75 hidden items-center justify-center p-4 z-50">
            <div class="bg-white p-6 rounded-lg shadow-xl max-w-sm w-full">
                <h3 id="notification-title" class="text-lg font-semibold text-gray-900 mb-3">Processing...</h3>
                <p id="notification-message" class="text-sm text-gray-500">Generating PDF, please wait...</p>
                <div id="notification-actions" class="mt-4 text-right">
                    <button onclick="document.getElementById('notification').classList.add('hidden')" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 transition duration-150">Close</button>
                </div>
            </div>
        </div>
        
    </div>

<script>

        // --- 1. DATA SOURCE (Updated with Trim Logic) ---
        async function loadReportsData() { 
            try {
                // GitHub Pages caches for ~10 minutes; the query string gets past that.
                const response = await fetch(`reports-data.json?t=${Date.now()}`, { cache: 'no-store' });
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status} - ${response.statusText}`);
                }
                
                const rawData = await response.json();
                return rawData.map(user => {
                    if (user.Name && user.Name.includes(' (')) {
                        const parts = user.Name.split(' (');
                        user.Name = parts[0].trim();
                        if (!user.RunnerID) {
                            user.RunnerID = parts[1].replace(')', '').trim();
                        }
                    }
                    return user;
                });

            } catch (error) {
                console.error('Could not fetch the reports data:', error);
                document.getElementById('report-table-container').innerHTML = 
                    '<p class="text-center text-red-600 font-semibold">ERROR: Could not load report data. Please ensure reports-data.json exists and is accessible.</p>';
                return []; 
            }
        }
        
        // --- 2. DIPLOMA DESIGN: new (HTML, diploma.js) or original (PNG templates) ---
        // The original certificates exist as images for these milestones only; every
        // other milestone is always drawn with the new design.
        const ORIGINAL_MILESTONES = [10, 25, 50, 100, 250, 500];
        let diplomaDesign = 'new';
        try { diplomaDesign = localStorage.getItem('diplomaDesign') === 'original' ? 'original' : 'new'; } catch (e) {}

        function setDesign(design) {
            diplomaDesign = design;
            try { localStorage.setItem('diplomaDesign', design); } catch (e) {}
            for (const d of ['new', 'original']) {
                document.getElementById(`design-${d}`).className =
                    `px-4 py-2 text-sm font-medium transition ${d === 'original' ? 'border-l border-gray-300 ' : ''}`
                    + (d === design ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50');
            }
            document.getElementById('design-note').textContent = design === 'original'
                ? `Oryginalny wzór istnieje tylko dla ${ORIGINAL_MILESTONES.join(', ')}. Pozostałe kamienie milowe są zawsze w nowym wzorze.`
                : '';
        }

        // The pre-2026 way: the certificate image with the name, date and place written on it.
        async function downloadOriginalDiplomaPdf(diploma, item, fileName) {
            const page = { width: 595, height: 842, nameY: 580, dateX: 510, dateY: 710, placeY: 732 };
            const doc = new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'pt', format: 'a4' });

            const img = new Image();
            img.src = `templates/DYPLOM${diploma.type}${diploma.milestone}.png`;
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = () => reject(new Error(`Failed to load image: ${img.src}`));
            });
            doc.addImage(img, 'PNG', 0, 0, page.width, page.height);

            doc.setFont('CaveatBrush-Regular', 'normal');
            doc.setFontSize(48);
            doc.setTextColor(50, 50, 50);
            doc.text(item.Name, (page.width - doc.getTextWidth(item.Name)) / 2, page.nameY);

            doc.setFont('Zeyada-Regular', 'normal');
            doc.setFontSize(22);
            doc.setTextColor(113, 113, 165);
            doc.text(item.CelebDate, page.dateX, page.dateY, { align: 'right' });

            doc.setFontSize(20);
            const place = 'parkrun Wzniesienie Osowy';
            doc.text(place, (page.width - doc.getTextWidth(place)) / 2, page.placeY);

            doc.save(fileName);
        }

        // --- 2b. WHEN THE DATA WAS LAST REFRESHED ---
        async function renderDataInfo() {
            const el = document.getElementById('data-info');
            try {
                const res = await fetch(`reports-meta.json?t=${Date.now()}`, { cache: 'no-store' });
                if (!res.ok) return;
                const meta = await res.json();
                const when = new Date(meta.generatedAt);
                const pad = n => String(n).padStart(2, '0');
                const stamp = `${pad(when.getDate())}.${pad(when.getMonth() + 1)}.${when.getFullYear()}, ${pad(when.getHours())}:${pad(when.getMinutes())}`;
                const eventDate = (meta.lastEventDate || '').replace(/\//g, '.');
                el.textContent = `Dane po edycji #${meta.lastEvent}${eventDate ? ` (${eventDate})` : ''} · odświeżone ${stamp} · dyplomy na ${meta.reportDate}`;
            } catch (e) {
                // No refresh info is not worth an error on the page.
            }
        }

        // --- 3. CORE PDF GENERATION FUNCTION ---
        async function generateSingleDiploma(item, index) {
            const notification = document.getElementById('notification');
            const titleElement = document.getElementById('notification-title');
            const messageElement = document.getElementById('notification-message');
            const actionsElement = document.getElementById('notification-actions');
            
            titleElement.textContent = `Generating PDF...`;
            messageElement.textContent = `Processing report #${index + 1}: ${item.Name}`;
            actionsElement.innerHTML = `<button onclick="document.getElementById('notification').classList.add('hidden')" class="px-4 py-2 bg-gray-300 text-gray-700 rounded-lg shadow-md hover:bg-gray-400 transition duration-150">Dismiss</button>`;
            notification.classList.remove('hidden');

            try {
                // Report_Template still arrives as e.g. "DYPLOMB200.png"; only the type
                // (B = runs, W = volunteering) and the number in it are used.
                const diploma = parseDiplomaTemplate(item.Report_Template);
                if (!diploma) throw new Error(`Unrecognised diploma template: ${item.Report_Template}`);

                const fileName = `${item.Name.replace(/\s/g, '_')}_Diploma.pdf`;
                if (diplomaDesign === 'original' && ORIGINAL_MILESTONES.includes(diploma.milestone)) {
                    await downloadOriginalDiplomaPdf(diploma, item, fileName);
                } else {
                    await downloadDiplomaPdf(
                        { type: diploma.type, milestone: diploma.milestone, name: item.Name, date: item.CelebDate },
                        fileName
                    );
                }

                notification.classList.add('hidden');
                titleElement.textContent = `Success!`;
                messageElement.textContent = `Diploma for ${item.Name} has been downloaded.`;
                actionsElement.innerHTML = `<button onclick="document.getElementById('notification').classList.add('hidden')" class="px-4 py-2 bg-blue-600 text-white rounded-lg shadow-md hover:bg-blue-700 transition duration-150">Got it!</button>`;

            } catch (error) {
                console.error(`Error generating PDF for ${item.Name}:`, error);
                titleElement.textContent = `Error!`;
                messageElement.textContent = `Failed to generate PDF. Check console.`;
                actionsElement.innerHTML = `<button onclick="document.getElementById('notification').classList.add('hidden')" class="px-4 py-2 bg-red-600 text-white rounded-lg shadow-md hover:bg-red-700 transition duration-150">Close</button>`;
            }
        }

        // --- 4. RENDER TABLE UI FUNCTION ---
        function renderTable(data) {
            const tableContainer = document.getElementById('report-table-container');
            
            if (data.length === 0) {
                tableContainer.innerHTML = '<p class="text-center text-gray-500">No reports found to display.</p>';
                return;
            }

            let html = `
            <div class="mb-6 p-4 border border-gray-200 rounded-lg bg-gray-50 flex items-center space-x-4">
                <label for="visitsFilter" class="text-sm font-medium text-gray-700 whitespace-nowrap">Filtruj wg liczby wizyt (min):</label>
                <input 
                    type="number" 
                    id="visitsFilter" 
                    placeholder="np. 5"
                    value="3"
                    class="block w-24 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm p-2"
                    onkeyup="filterTableByVisits()"
                    onchange="filterTableByVisits()"
                >
                <p id="filter-status" class="text-sm text-gray-500 ml-4"></p>
            </div>
            <table class="min-w-full divide-y divide-gray-200 rounded-lg overflow-hidden">
                <thead class="bg-blue-50">
                    <tr>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">ID</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Osiągnięcie</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Wizyty</th>
                        <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Imię</th>
                        <th class="px-6 py-3 text-center text-xs font-medium text-gray-500 uppercase">Akcja</th>
                    </tr>
                </thead>
                <tbody class="bg-white divide-y divide-gray-200">
            `;

            data.forEach((item, index) => {
                const itemJson = JSON.stringify(item).replace(/'/g, "\\'");
                html += `
                    <tr>
                        <td class="px-6 py-4 text-sm font-medium text-gray-900">#${index + 1}</td>
                        <td class="px-6 py-4 text-sm text-gray-700">${item.Report_Title}</td>
                        <td class="px-6 py-4 text-sm text-gray-700">${item.num_of_visits}</td>
                        <td class="px-6 py-4 text-sm text-gray-700">
                            ${item.Name}
                            <a href="https://www.parkrun.pl/parkrunner/${item.RunnerID}/" target="_blank"
                               title="Sprawdź profil ${item.Name}" class="ml-1 inline-block text-gray-400 hover:text-blue-600 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" class="inline w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                                </svg>
                            </a>
                            ${item.FirstOpportunity ? `<br><span class="text-xs text-amber-500 font-medium">od ${item.FirstOpportunity}</span>` : ''}
                        </td>
                        <td class="px-6 py-4 text-center">
                            <button 
                                onclick='generateSingleDiploma(${itemJson}, ${index})'
                                class="px-4 py-2 text-sm font-medium text-white bg-green-600 rounded-full hover:bg-green-700 transition shadow-md"
                            >
                                Pobierz Raport
                            </button>
                        </td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            tableContainer.innerHTML = html;
        }

        function filterTableByVisits() {
            const filterValue = parseInt(document.getElementById('visitsFilter').value);
            const tableBody = document.querySelector('#report-table-container tbody');
            const rows = tableBody ? tableBody.querySelectorAll('tr') : [];
            const statusElement = document.getElementById('filter-status');
            let visibleRowCount = 0;

            if (isNaN(filterValue) || filterValue < 0) {
                rows.forEach(row => { row.style.display = ''; visibleRowCount++; });
                statusElement.textContent = `Wyświetlanie wszystkich ${rows.length} rekordów.`;
                return;
            }

            rows.forEach(row => {
                const visits = parseInt(row.children[2].textContent.trim());
                if (visits >= filterValue) {
                    row.style.display = '';
                    visibleRowCount++;
                } else {
                    row.style.display = 'none';
                }
            });
            statusElement.textContent = `Wyświetlanie ${visibleRowCount} rekordów (min. ${filterValue} wizyt).`;
        }

        // --- 5. MANUAL DIPLOMA GENERATOR ---
        let manualType = 'runner';

        function setType(type) {
            manualType = type;
            document.getElementById('type-runner').className =
                `flex-1 py-2 text-sm font-medium transition ${type === 'runner' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'}`;
            document.getElementById('type-vol').className =
                `flex-1 py-2 text-sm font-medium transition ${type === 'vol' ? 'bg-blue-600 text-white' : 'bg-white text-gray-700 hover:bg-gray-50'}`;
        }

        function getNextSaturday() {
            const today = new Date();
            const day = today.getDay(); // 0=Sun, 6=Sat
            const daysAhead = day === 6 ? 0 : (6 - day);
            const sat = new Date(today);
            sat.setDate(today.getDate() + daysAhead);
            return sat.toISOString().split('T')[0];
        }

        function formatDateForDiploma(isoDate) {
            const [y, m, d] = isoDate.split('-');
            return `${d}.${m}.${y}`;
        }

        function generateManualDiploma() {
            const name = document.getElementById('manual-name').value.trim();
            const milestone = document.getElementById('manual-milestone').value;
            const date = document.getElementById('manual-date').value;

            if (!name) { alert('Podaj imię i nazwisko.'); return; }
            if (!date) { alert('Wybierz datę.'); return; }

            const templateCode = manualType === 'runner' ? 'B' : 'W';
            const item = {
                Name: name,
                Report_Template: `DYPLOM${templateCode}${milestone}.png`,
                CelebDate: formatDateForDiploma(date),
            };
            generateSingleDiploma(item, 0);
        }

        // --- 6. INITIALIZE APP ---
        async function initApp() {
            const reportsData = await loadReportsData();
            renderTable(reportsData);
            filterTableByVisits();
            document.getElementById('manual-date').value = getNextSaturday();
            document.getElementById('manual-milestone').innerHTML = DIPLOMA_MILESTONES
                .map(m => `<option value="${m.count}"${m.count === 50 ? ' selected' : ''}>${m.count}</option>`).join('');
            ensureDiplomaFonts();
            setDesign(diplomaDesign);
            renderDataInfo();
        }

        window.onload = initApp;
    </script>
</body>
</html>
